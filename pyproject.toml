[project]
name = "region-import-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rocky Wilson", email = "rwilson2@mercy.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pycountry>=26.2.16",
    "pydantic>=2.14.1",
    "pygeoboundaries-geolab>=0.0.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
region-import-tool = "main:cli"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "types-shapely>=2.1.0.20260728",
]
